name: deploy-to-vps

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/deploy-to-vps.yml'
      - 'wk-crm-laravel/**'
      - 'wk-gateway/**'
      - 'wk-admin-frontend/**'
      - 'docker-compose.yml'

concurrency:
  group: deploy-to-vps
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      laravel: ${{ steps.filter.outputs.laravel }}
      gateway: ${{ steps.filter.outputs.gateway }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            laravel:
              - 'wk-crm-laravel/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-to-vps.yml'
            gateway:
              - 'wk-gateway/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-to-vps.yml'
            admin:
              - 'wk-admin-frontend/**'
              - '.github/workflows/deploy-to-vps.yml'

  deploy-laravel:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.laravel == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t wk-crm-laravel:${SHORT_SHA} \
            -t wk-crm-laravel:latest \
            ./wk-crm-laravel

      - name: Package Docker image
        run: |
          docker save wk-crm-laravel:${SHORT_SHA} | gzip > /tmp/wk-crm-laravel_${SHORT_SHA}.tar.gz

      - name: Upload image to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
            /tmp/wk-crm-laravel_${SHORT_SHA}.tar.gz \
            $VPS_USER@$VPS_HOST:/tmp/

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF
            set -e
            SHA="${SHORT_SHA}"
            IMAGE_TAR="/tmp/wk-crm-laravel_${SHORT_SHA}.tar.gz"
            cd /opt/wk-crm

            if [ ! -f "\$IMAGE_TAR" ]; then
              echo "❌ Imagem não encontrada em \$IMAGE_TAR"
              exit 1
            fi

            echo "📦 Carregando imagem Docker..."
            gunzip -c "\$IMAGE_TAR" | docker load
            rm -f "\$IMAGE_TAR"

            OLD_TAG=$(grep -m1 -E 'image:\s*wk-crm-laravel:' docker-compose.yml | sed -E 's/.*wk-crm-laravel:([^ ]+).*/\1/')
            if [ -z "\$OLD_TAG" ]; then
              OLD_TAG="unknown"
            fi

            export NEW_SHA="\$SHA"
            python3 - << 'PY'
            import os
            import re
            from pathlib import Path

            path = Path("/opt/wk-crm/docker-compose.yml")
            text = path.read_text()
            sha = os.environ["NEW_SHA"]

            if re.search(r"(?m)^\s*image:\s*wk-crm-laravel:.*$", text):
                text = re.sub(r"(?m)^(\s*image:\s*wk-crm-laravel:).*$", r"\1" + sha, text)
            elif re.search(r"(?m)^\s*build:\s*\./wk-crm-laravel\s*$", text):
                text = re.sub(r"(?m)^(\s*)build:\s*\./wk-crm-laravel\s*$", r"\1image: wk-crm-laravel:" + sha, text)
            else:
                text = re.sub(r"(?m)^(\s*wk-crm-laravel:\s*)$", r"\1\n    image: wk-crm-laravel:" + sha, text, count=1)

            path.write_text(text)
            PY

            echo "🚀 Atualizando serviço wk-crm-laravel..."
            docker-compose up -d --no-deps wk-crm-laravel
            docker-compose exec -T wk-crm-laravel composer install --no-dev --optimize-autoloader
            docker-compose exec -T wk-crm-laravel php artisan migrate --force
            docker-compose exec -T wk-crm-laravel php artisan config:cache
            docker-compose exec -T wk-crm-laravel php artisan route:cache

            sleep 5
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "✅ Deploy concluído com sucesso"
              docker image prune -f
            else
              echo "❌ Health check falhou, iniciando rollback"
              if [ "\$OLD_TAG" != "unknown" ]; then
                export NEW_SHA="\$OLD_TAG"
                python3 - << 'PY'
                import os
                import re
                from pathlib import Path

                path = Path("/opt/wk-crm/docker-compose.yml")
                text = path.read_text()
                sha = os.environ["NEW_SHA"]

                if re.search(r"(?m)^\s*image:\s*wk-crm-laravel:.*$", text):
                    text = re.sub(r"(?m)^(\s*image:\s*wk-crm-laravel:).*$", r"\1" + sha, text)
                elif re.search(r"(?m)^\s*build:\s*\./wk-crm-laravel\s*$", text):
                    text = re.sub(r"(?m)^(\s*)build:\s*\./wk-crm-laravel\s*$", r"\1image: wk-crm-laravel:" + sha, text)
                else:
                    text = re.sub(r"(?m)^(\s*wk-crm-laravel:\s*)$", r"\1\n    image: wk-crm-laravel:" + sha, text, count=1)

                path.write_text(text)
                PY
                docker-compose up -d --no-deps wk-crm-laravel
                docker-compose exec -T wk-crm-laravel php artisan config:cache
                docker-compose exec -T wk-crm-laravel php artisan route:cache
              fi
              exit 1
            fi
          EOF

  deploy-gateway:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy gateway on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            cd /opt/wk-crm

            git fetch origin main
            git reset --hard origin/main

            if [ -f docker-compose.yml ] && grep -qE '^\s*wk-gateway:\s*$' docker-compose.yml; then
              docker-compose up -d --build --no-deps wk-gateway
            else
              echo "ℹ️ Serviço wk-gateway não encontrado no docker-compose.yml; sync de código concluído."
            fi
          EOF

  deploy-admin-frontend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.admin == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'wk-admin-frontend/package-lock.json'

      - name: Build admin frontend
        working-directory: wk-admin-frontend
        run: |
          npm ci
          npm run build:prod

      - name: Package admin build
        run: |
          tar -czf /tmp/wk-admin-frontend_dist.tar.gz -C wk-admin-frontend/dist/admin-frontend .

      - name: Upload and deploy admin frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
            /tmp/wk-admin-frontend_dist.tar.gz \
            $VPS_USER@$VPS_HOST:/tmp/

          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            TARGET_DIR="/var/www/consultoriawk-crm/admin"

            mkdir -p "$TARGET_DIR"
            rm -rf "$TARGET_DIR"/*
            tar -xzf /tmp/wk-admin-frontend_dist.tar.gz -C "$TARGET_DIR"
            rm -f /tmp/wk-admin-frontend_dist.tar.gz

            chown -R www-data:www-data "$TARGET_DIR"
            if command -v nginx >/dev/null 2>&1; then
              nginx -t && systemctl reload nginx
            fi
          EOF
